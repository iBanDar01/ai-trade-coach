name: ShiftFlow heartbeat

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check ShiftFlow rounds
        run: |
          curl --fail --silent --show-error --max-time 30 https://shiftflow-kasb.floot.app/_api/heartbeat
